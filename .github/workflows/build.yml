name: Build portable launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable x64 folder (no single-file extraction)
        shell: pwsh
        run: |
          dotnet publish RobloxLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:UseAppHost=true -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          if (-not (Test-Path "publish/Roblox-Launcher.exe")) { throw "Published launcher EXE is missing" }
          if (-not (Test-Path "publish/Roblox-Launcher.dll")) { throw "Published launcher assembly is missing" }

      - name: Smoke-test startup and form construction
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "Roblox-Launcher-20261120-startup-trace-02.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path "publish/Roblox-Launcher.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Launcher self-test failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path $log)) { throw "Self-test did not create its version-specific startup log" }
          $logText = Get-Content $log -Raw
          $markers = @(
            "BUILD-ID=20261120-startup-trace-02",
            "DEPENDENCY CHECK:",
            "SELF-TEST STAGE:",
            "FORM CONSTRUCTOR: Entered LauncherForm constructor.",
            "FORM CONSTRUCTOR: Constructor completed successfully.",
            "SELF-TEST: WinForms initialization and main window construction succeeded."
          )
          foreach ($marker in $markers) {
            if (-not $logText.Contains($marker)) { throw "Self-test log is missing marker: $marker" }
          }

      - name: Verify portable folder contents
        shell: pwsh
        run: |
          $required = @("Roblox-Launcher.exe", "Roblox-Launcher.dll", "Roblox-Launcher.deps.json", "Roblox-Launcher.runtimeconfig.json")
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path "publish" $name))) { throw "Publish folder is missing $name" }
          }
          Copy-Item "Run-Diagnostics.bat" "publish/Run-Diagnostics.bat"
          @"
Roblox Launcher portable package
Build ID: 20261120-startup-trace-02
Git commit: $env:GITHUB_SHA

Keep every file in this folder together.
Start Roblox-Launcher.exe from this folder.
The launcher writes its unique diagnostic log to:
%TEMP%\Roblox-Launcher-20261120-startup-trace-02.log
"@ | Set-Content "publish/BUILD-INFO.txt" -Encoding UTF8
          Write-Host "Verified portable folder. Files: $((Get-ChildItem publish -File).Count)"

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Launcher-Portable-20261120-startup-trace-02
          path: publish/
          if-no-files-found: error
          compression-level: 0
