name: Build portable launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable x64 executable
        run: dotnet publish RobloxLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Smoke-test startup and form construction
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish/Roblox-Launcher.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Launcher self-test failed with exit code $($process.ExitCode)"
          }

      - name: Stage launcher beside diagnostic script
        run: Copy-Item publish\Roblox-Launcher.exe Roblox-Launcher.exe


      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Launcher-Windows-x64
          path: |
            Roblox-Launcher.exe
            Run-Diagnostics.bat
